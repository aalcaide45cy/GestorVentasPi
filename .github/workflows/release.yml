name: Publicar versión

# Al subir una etiqueta vX.Y.Z se publica la imagen multi-arquitectura en GHCR y se adjuntan los instaladores.
on:
  push:
    tags: ["v*"]
  # Disparo manual: publica la versión indicada (crea la etiqueta vX.Y.Z sobre la rama elegida)
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, sin la v (por ejemplo 1.0.7)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versión
        id: v
        env:
          VERSION_MANUAL: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_MANUAL" ]; then echo "version=${VERSION_MANUAL#v}" >> "$GITHUB_OUTPUT"; else echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
      - name: Imagen amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          tags: |
            ghcr.io/aalcaide45cy/gestorventaspi:${{ steps.v.outputs.version }}
            ghcr.io/aalcaide45cy/gestorventaspi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Instaladores (online, offline y para Raspberry Pi)
        run: |
          ./scripts/empaquetar.sh "${{ steps.v.outputs.version }}"
          ./scripts/empaquetar.sh "${{ steps.v.outputs.version }}" --offline
          ./scripts/empaquetar.sh "${{ steps.v.outputs.version }}" --pi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist-instalador/*
