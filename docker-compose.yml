# Compose de DESARROLLO: solo Postgres. La app se ejecuta con `npm run dev`.
# (El compose de producción con el servicio "app" se añade en la fase F6.)
services:
  db:
    image: postgres:16-bookworm
    container_name: gestorventas-db
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-gestorventas}
    # Ajustes para un PC de desarrollo con mucha memoria (el PostgreSQL por defecto usa solo 128 MB y va justo con documentos de varios GB).
    # Se aplican al recrear el contenedor (docker compose up -d db). En la Raspberry se usan los del instalador, que son más prudentes.
    command: >
      postgres -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
               -c effective_cache_size=${PG_CACHE:-8GB}
               -c work_mem=${PG_WORK_MEM:-32MB}
               -c maintenance_work_mem=${PG_MAINT:-512MB}
               -c max_wal_size=2GB
               -c wal_compression=on
               -c random_page_cost=1.1
               -c jit=off
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
